; LiquidGlass — the shared design language of Spicy Lyrics and Wave Player,
; applied to Spotify's own chrome so all three read as one product.
;
; Derived from:
;   Spicy Lyrics  src/css/tokens.css  (github.com/Spikerko/spicy-lyrics)
;   Wave Player   waveplayer.js :585  (github.com/03x1/Wave-Player)
;
; Achromatic on purpose. Both sources refuse a fixed accent — Spicy Lyrics
; calls it "restraint over color", Wave Player overwrites its accent from the
; album art on every track. A colored button here would fight both, so the
; only color in the UI is the artwork.

[Glass]
; Spicy's --color-text-primary (.92 white) resolved against the base.
text                   = EBEBEC
; Spicy's --color-text-secondary (.6 white). 6.9:1 on the base — passes AA.
subtext                = 9A9AA0
; Wave Player's body background, verbatim. Not pure black: OLED smear.
main                   = 0A0A0C
main-elevated          = 121216
highlight              = 16161B
highlight-elevated     = 1C1C20
sidebar                = 0A0A0C
player                 = 0A0A0C
card                   = 121216
; Tinted near-black, per Spicy's --liquid-cast. A pure-black shadow reads as
; stamped onto the page rather than cast by the surface.
shadow                 = 08080A
selected-row           = FFFFFF
button                 = EBEBEC
button-active          = FFFFFF
button-disabled        = 3A3A40
tab-active             = 1C1C20
notification           = 1C1C20
notification-error     = FF6E6E
misc                   = 8A8F98
